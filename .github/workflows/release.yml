name: Release

# 打 tag（v*）即自动构建 Windows 绿色包并发布到 GitHub Release：
#   1) 安装依赖 -> 2) PyInstaller onedir 构建 -> 3) 打成 PixelFoundry-<tag>-win64.zip
#   4) 用仓库自带的 GITHUB_TOKEN 创建 Release（说明文字取 docs/releases/<tag>.md）
on:
  push:
    tags: ["v*"]

permissions:
  contents: write          # 创建 Release / 上传附件需要

jobs:
  windows:
    name: Build & publish (Windows x64)
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUNBUFFERED: "1"
      PYTHONUTF8: "1"            # 控制台按 UTF-8，避免中文输出抛 UnicodeEncodeError
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Sanity check (version / imports)
        run: python -c "import config.settings as s; print('building', s.APP_DISPLAY_NAME, 'v' + s.APP_VERSION)"

      - name: Build (PyInstaller onedir)
        run: python -m PyInstaller PixelFoundry.spec --noconfirm --clean

      - name: Package zip
        run: python tools/package_release.py --out release --tag "${{ github.ref_name }}"

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $notes = "docs/releases/$tag.md"
          $zip = Get-ChildItem release/*.zip | Select-Object -First 1
          if (Test-Path $notes) {
            $title = (Get-Content $notes -TotalCount 1) -replace '^#\s*', ''
            gh release create $tag $zip.FullName --title $title --notes-file $notes
          } else {
            gh release create $tag $zip.FullName --title "PixelFoundry IDE $tag" --generate-notes
          }
